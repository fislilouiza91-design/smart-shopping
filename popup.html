<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مساعد التسوق الذكي</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 320px;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #fff;
    color: #0f172a;
  }
  .header {
    background: linear-gradient(135deg, #6366f1, #a855f7);
    color: #fff;
    padding: 16px;
    text-align: center;
  }
  .header h1 { font-size: 16px; font-weight: 800; }
  .header p { font-size: 11px; opacity: .9; margin-top: 4px; }
  .body { padding: 16px; }
  .tip {
    background: #f8fafc;
    border: 1.5px solid #e2e8f0;
    border-radius: 10px;
    padding: 12px;
    font-size: 12px;
    color: #64748b;
    line-height: 1.6;
    text-align: center;
  }
  .tip strong { color: #6366f1; display: block; margin-bottom: 6px; font-size: 13px; }
  .stores {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 12px;
    justify-content: center;
  }
  .stores span {
    background: #f1f5f9;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    color: #475569;
  }
  .footer {
    border-top: 1px solid #e2e8f0;
    padding: 10px 16px;
    text-align: center;
    font-size: 10px;
    color: #94a3b8;
  }
  .footer a { color: #6366f1; text-decoration: none; }
</style>
</head>
<body>
  <div class="header">
    <h1>🛒 مساعد التسوق الذكي</h1>
    <p>قارن، حلل، ووفّر</p>
  </div>

  <div class="body">
    <div class="tip">
      <strong>افتح أي صفحة منتج</strong>
      ستظهر لك المقارنة تلقائياً على الصفحة.
    </div>

    <div class="stores">
      <span>🛍️ نون</span>
      <span>📦 أمازون</span>
      <span>🚀 علي إكسبريس</span>
      <span>🏷️ إيباي</span>
      <span>🎁 تيمو</span>
    </div>
  </div>

  <div class="footer">
    <a href="#" id="privacyLink">سياسة الخصوصية</a>
  </div>
</body>
</html>
